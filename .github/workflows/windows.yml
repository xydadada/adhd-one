name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: ADHD-Windows-x64
          path: |
            dist/ADHD-Setup-*-x64.exe
          if-no-files-found: error
