appId: io.github.xydadada.adhd
productName: ADHD One
directories:
  output: dist
files:
  - out/**/*
  - src/renderer/**/*
  - src/preload.cjs
  - assets/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - '!**/*.map'
asar: true
extraResources:
  - from: vendor/node
    to: node-runtime
    filter: [node.exe, LICENSE, README.md]
  - from: vendor/runtime-closure/dsh-runtime
    to: dsh-runtime
    filter: [package.json, package-lock.json, bin/**/*]
  - from: vendor/runtime-closure/dsh-runtime/node_modules
    to: dsh-runtime/node_modules
  - from: src/supervisor.mjs
    to: supervisor/supervisor.mjs
  - from: node_modules/7zip-bin/win/x64/7za.exe
    to: tools/7za.exe
  - from: build/licenses
    to: licenses
  - from: build/portable.marker
    to: portable.marker
npmRebuild: false
afterPack: scripts/after-pack.mjs
win:
  target: [zip]
  icon: assets/icon.ico
  artifactName: ADHD-One-Portable-${version}-win-${arch}.${ext}
publish:
  - provider: github
    owner: xydadada
    repo: adhd-one
    releaseType: release
