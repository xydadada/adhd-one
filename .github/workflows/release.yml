name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24.18.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix runtime
      - run: npm run check
      - run: npm run build:win
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: dist/ADHD-One-0.2.0.spdx.json
      - name: Generate runtime manifest and checksums
        run: node scripts/generate-release-metadata.mjs
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with: { subject-path: 'dist/ADHD-One-*' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: release-assets, path: 'dist/*' }
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseFlags = @()
          if ($env:GITHUB_REF_NAME.Contains('-')) { $releaseFlags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @releaseFlags --title "ADHD One $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md dist/ADHD-One-* dist/SHA256SUMS.txt dist/runtime-manifest.json
