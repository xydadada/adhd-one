name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      setup_artifact_name: ${{ steps.artifact-names.outputs.setup_artifact_name }}
      portable_artifact_name: ${{ steps.artifact-names.outputs.portable_artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix runtime
      - run: npm run audit:signatures
      - run: npm run check
      - name: Generate and check physical license closure
        run: npm run license:closure:gate
      - run: npm run build:win
      - name: Verify packaged license closure carrier
        run: node scripts/generate-license-closure.mjs --check --package-root dist/win-unpacked
      - run: npm run verify:fuses -- "dist/win-unpacked/ADHD One.exe"
      - name: Verify package version and Windows assets
        id: windows-assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $version = [string]$package.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'package.json has no version'
          }

          $dist = Join-Path $PWD 'dist'
          $setupName = "ADHD-One-Setup-$version-x64.exe"
          $portableName = "ADHD-One-Portable-$version-win-x64.zip"
          $setupPath = Join-Path $dist $setupName
          $portablePath = Join-Path $dist $portableName
          $latestPath = Join-Path $dist 'latest.yml'
          $required = @(
            @{ name = $setupName; path = $setupPath },
            @{ name = $portableName; path = $portablePath },
            @{ name = 'latest.yml'; path = $latestPath }
          )
          foreach ($artifact in $required) {
            if (-not (Test-Path -LiteralPath $artifact.path -PathType Leaf)) {
              throw "Missing expected Windows artifact: $($artifact.name)"
            }
            if ((Get-Item -LiteralPath $artifact.path).Length -le 0) {
              throw "Empty Windows artifact: $($artifact.name)"
            }
          }
          $setup = Get-Item -LiteralPath $setupPath
          if ($setup.Length -gt 145MB) {
            throw "Setup exceeds the 145 MiB budget: $([math]::Round($setup.Length / 1MB, 2)) MiB"
          }

          $latest = Get-Content -Raw -LiteralPath $latestPath
          $versionPattern = '(?m)^version:\s*' + [regex]::Escape($version) + '\s*$'
          if ($latest -notmatch $versionPattern) {
            throw "latest.yml version does not match package.json ($version)"
          }

          $latestPathMatch = [regex]::Match($latest, '(?m)^path:\s*([^\r\n]+)\s*$')
          $latestSha512Match = [regex]::Match($latest, '(?m)^sha512:\s*([^\r\n]+)\s*$')
          if (-not $latestPathMatch.Success -or -not $latestSha512Match.Success) {
            throw 'latest.yml is missing path or sha512'
          }
          $latestInstallerPath = $latestPathMatch.Groups[1].Value.Trim()
          $latestSha512 = $latestSha512Match.Groups[1].Value.Trim()
          if ($latestInstallerPath -ne $setupName) {
            throw "latest.yml path does not match $setupName"
          }
          $sha512 = [Security.Cryptography.SHA512]::Create()
          try {
            $setupStream = [System.IO.File]::OpenRead($setupPath)
            try {
              $actualSha512 = [Convert]::ToBase64String($sha512.ComputeHash($setupStream))
            } finally {
              $setupStream.Dispose()
            }
          } finally {
            $sha512.Dispose()
          }
          if ($actualSha512 -ne $latestSha512) {
            throw 'latest.yml SHA-512 does not match Setup'
          }

          "setup_path=dist/$setupName" >> $env:GITHUB_OUTPUT
          "portable_path=dist/$portableName" >> $env:GITHUB_OUTPUT
      - name: Packaged Portable win-unpacked launch smoke
        shell: pwsh
        run: >-
          node scripts/e2e/packaged.mjs
          --exe "dist/win-unpacked/ADHD One.exe"
          --output evidence/portable-win-unpacked-launch.json
          --scenario launch
          --cycles 1
          --require-portable
      - name: Verify packaged Portable win-unpacked evidence
        run: npm run verify:evidence -- --portable evidence/portable-win-unpacked-launch.json
      - name: Freeze build artifact names
        id: artifact-names
        shell: pwsh
        run: |
          $setup = 'adhd-one-setup-{0}-{1}' -f $env:GITHUB_SHA, $env:GITHUB_RUN_ATTEMPT
          $portable = 'adhd-one-portable-{0}-{1}' -f $env:GITHUB_SHA, $env:GITHUB_RUN_ATTEMPT
          "setup_artifact_name=$setup" >> $env:GITHUB_OUTPUT
          "portable_artifact_name=$portable" >> $env:GITHUB_OUTPUT
      - name: Upload Setup input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact-names.outputs.setup_artifact_name }}
          path: |
            ${{ steps.windows-assets.outputs.setup_path }}
            dist/latest.yml
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload Portable input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact-names.outputs.portable_artifact_name }}
          path: ${{ steps.windows-assets.outputs.portable_path }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: adhd-one-build-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/portable-win-unpacked-launch.json
          retention-days: 30
          if-no-files-found: warn

  installed-e2e:
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Download Setup input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build-windows.outputs.setup_artifact_name }}
          path: dist
      - name: NSIS installed E2E suite and uninstall residue check
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          ./scripts/e2e/installed.ps1 `
            -SetupPath "dist/ADHD-One-Setup-$($package.version)-x64.exe" `
            -EvidenceDirectory evidence/installed
      - name: Verify installed E2E evidence
        run: npm run verify:evidence -- evidence/installed
      - name: Upload installed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: adhd-one-installed-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/installed/*.json
          retention-days: 30
          if-no-files-found: warn

  portable-e2e:
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Download Portable input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build-windows.outputs.portable_artifact_name }}
          path: dist
      - name: Portable ZIP launch E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $zip = Join-Path $PWD "dist/ADHD-One-Portable-$($package.version)-win-x64.zip"
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $portableRoot = [IO.Path]::GetFullPath((Join-Path $runnerTemp "adhd-one-portable-$([guid]::NewGuid().ToString('N'))"))
          if (-not $portableRoot.StartsWith("$runnerTemp$([IO.Path]::DirectorySeparatorChar)", [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Portable extraction path escaped RUNNER_TEMP'
          }
          try {
            New-Item -ItemType Directory -Path $portableRoot | Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $portableRoot
            $executables = @(Get-ChildItem -LiteralPath $portableRoot -Recurse -File -Filter 'ADHD One.exe')
            if ($executables.Count -ne 1) {
              throw "Expected exactly one portable ADHD One.exe, found $($executables.Count)"
            }
            node scripts/e2e/packaged.mjs `
              --exe $executables[0].FullName `
              --output evidence/portable-launch.json `
              --scenario launch `
              --cycles 1 `
              --require-portable
            if ($LASTEXITCODE -ne 0) { throw "Portable launch E2E failed with exit code $LASTEXITCODE" }
          } finally {
            if (Test-Path -LiteralPath $portableRoot) {
              Remove-Item -LiteralPath $portableRoot -Recurse -Force
            }
          }
          if (Test-Path -LiteralPath $portableRoot) {
            throw 'Portable extraction directory cleanup failed'
          }
      - name: Verify Portable ZIP evidence
        run: npm run verify:evidence -- --portable evidence/portable-launch.json
      - name: Upload Portable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: adhd-one-portable-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/portable-launch.json
          retention-days: 30
          if-no-files-found: error

  test-and-package:
    if: always()
    needs: [build-windows, installed-e2e, portable-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Windows verification job
        env:
          BUILD_RESULT: ${{ needs.build-windows.result }}
          INSTALLED_RESULT: ${{ needs.installed-e2e.result }}
          PORTABLE_RESULT: ${{ needs.portable-e2e.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$INSTALLED_RESULT" = success
          test "$PORTABLE_RESULT" = success
